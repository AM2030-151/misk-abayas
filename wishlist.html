
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d32">
  <title>المفضلة | MISK ABAYAS</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Almarai', sans-serif;
      background: #f8f7f3;
      color: #24352e;
    }

    .wishlist-page {
      max-width: 1150px;
      margin: 35px auto;
      padding: 20px;
    }

    .wishlist-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .wishlist-heading h1 {
      color: #123d32;
      font-size: 29px;
    }

    .wishlist-heading p {
      color: #777;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .wishlist-card {
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }

    .wishlist-image {
      width: 100%;
      height: 290px;
      object-fit: cover;
      background: #f1eee7;
      display: block;
    }

    .wishlist-info {
      padding: 17px;
    }

    .wishlist-info h3 {
      color: #123d32;
      font-size: 16px;
      margin: 0 0 10px;
    }

    .wishlist-price {
      color: #a27b35;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .wishlist-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .wishlist-actions a,
    .wishlist-actions button {
      flex: 1;
      min-width: 100px;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      padding: 11px 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .view-button {
      background: #123d32;
      color: #fff;
    }

    .remove-button {
      background: #fbeaea;
      color: #a33333;
    }

    .empty-wishlist {
      text-align: center;
      padding: 55px 15px;
      background: #fff;
      border-radius: 15px;
      color: #777;
    }

    .empty-wishlist .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty-wishlist h2 {
      color: #123d32;
    }

    .empty-wishlist a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 25px;
      background: #123d32;
      color: #fff;
      border-radius: 9px;
      text-decoration: none;
    }

    @media (max-width: 850px) {
      .wishlist-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      .wishlist-grid {
        grid-template-columns: 1fr;
      }

      .wishlist-image {
        height: 330px;
      }

      .wishlist-page {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <p>أهلاً بكم في متجر مسك للعبايات</p>
  </div>

  <header class="main-header">
    <div class="container">
      <a href="index.html" class="logo">
        <span>MISK</span> ABAYAS
      </a>

      <nav>
        <a href="index.html">الرئيسية</a>
        <a href="cart.html">السلة</a>
        <a href="account.html">حسابي</a>
      </nav>
    </div>
  </header>

  <main class="wishlist-page">

    <div class="wishlist-heading">
      <h1>قائمة المفضلة ♡</h1>
      <p>احتفظي بالعبايات التي أعجبتك للعودة إليها لاحقاً</p>
    </div>

    <div id="wishlist-content"></div>

  </main>

  <footer class="main-footer">
    <p>© 2026 MISK ABAYAS - جميع الحقوق محفوظة</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>

  <script>
    const container = document.getElementById('wishlist-content');

    function safeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function money(value) {
      return Number(value || 0).toLocaleString('ar-SA') + ' ر.س';
    }

    function renderWishlist() {
      const store = window.MiskStore;

      if (!store) {
        container.textContent = 'تعذر تحميل المفضلة. تأكدي من وجود ملف app.js.';
        return;
      }

      const favorites = store.getWishlist() || [];

      if (!favorites.length) {
        container.innerHTML = `
          <div class="empty-wishlist">
            <div class="icon">♡</div>
            <h2>قائمة المفضلة فارغة</h2>
            <p>لم تضيفي أي منتجات إلى المفضلة حتى الآن.</p>
            <a href="index.html">تصفحي المنتجات</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="wishlist-grid">
          ${favorites.map((product, index) => {
            const id = product.id ?? product.productId;
            const name = safeText(product.name || product.title || 'منتج');
            const price = Number(product.sale_price ?? product.salePrice ?? product.price ?? 0);
            const image = safeText(product.image_url || product.image || '');
            const link = 'product.html?id=' + encodeURIComponent(id ?? '');

            return `
              <article class="wishlist-card">
                <img
                  class="wishlist-image"
                  src="${image}"
                  alt="${name}"
                  onerror="this.style.display='none'"
                >

                <div class="wishlist-info">
                  <h3>${name}</h3>

                  <div class="wishlist-price">
                    ${money(price)}
                  </div>

                  <div class="wishlist-actions">
                    <a class="view-button" href="${link}">
                      عرض المنتج
                    </a>

                    <button class="remove-button"
                      type="button"
                      data-remove-index="${index}">
                      إزالة
                    </button>
                  </div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;

      container.querySelectorAll('[data-remove-index]').forEach(button => {
        button.addEventListener('click', () => {
          removeFavorite(Number(button.dataset.removeIndex));
        });
      });
    }

    function removeFavorite(index) {
      const store = window.MiskStore;
      const favorites = store.getWishlist() || [];
      const product = favorites[index];

      if (!product) return;

      store.toggleWishlist(product.id ?? product.productId);
      renderWishlist();
    }

    renderWishlist();
  </script>

</body>
</html>
