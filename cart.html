
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d32">
  <title>سلة المشتريات | MISK ABAYAS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Almarai', sans-serif;
      background: #f8f7f3;
      color: #24352e;
    }

    .cart-page {
      max-width: 1100px;
      margin: 35px auto;
      padding: 20px;
    }

    .cart-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .cart-heading h1 {
      color: #123d32;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 25px;
      align-items: start;
    }

    .cart-items,
    .cart-summary {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid #eee9df;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item img {
      width: 110px;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      background: #f1eee7;
    }

    .item-name {
      color: #123d32;
      font-size: 17px;
      font-weight: 800;
      margin: 5px 0 10px;
    }

    .item-info {
      color: #777;
      font-size: 13px;
      margin: 7px 0;
    }

    .item-price {
      color: #a27b35;
      font-weight: 800;
      margin: 10px 0;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .quantity-control button {
      width: 32px;
      height: 32px;
      border: 1px solid #ddd3c0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity-control span {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    .remove-item {
      color: #b64a4a;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      font-family: inherit;
      font-size: 13px;
    }

    .summary-title {
      color: #123d32;
      font-size: 20px;
      margin: 0 0 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 0;
      color: #666;
      font-size: 14px;
    }

    .summary-total {
      border-top: 1px solid #eee9df;
      padding-top: 18px;
      margin-top: 20px;
      color: #123d32;
      font-size: 19px;
      font-weight: 800;
    }

    .shipping-note {
      background: #f5f1e7;
      color: #80632e;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.8;
      margin: 18px 0;
    }

    .checkout-button,
    .continue-button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout-button {
      background: #123d32;
      color: #fff;
      border: none;
      margin-top: 15px;
    }

    .continue-button {
      background: #f5f1e7;
      color: #123d32;
      margin-top: 12px;
    }

    .empty-cart {
      text-align: center;
      padding: 50px 15px;
      color: #777;
    }

    .empty-cart .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty-cart h2 {
      color: #123d32;
    }

    @media (max-width: 750px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-page {
        padding: 12px;
      }

      .cart-item {
        grid-template-columns: 85px 1fr;
        gap: 12px;
      }

      .cart-item img {
        width: 85px;
        height: 110px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <p>أهلاً بكم في متجر مسك للعبايات</p>
  </div>

  <header class="main-header">
    <div class="container">
      <a href="index.html" class="logo">
        <span>MISK</span> ABAYAS
      </a>

      <nav>
        <a href="index.html">الرئيسية</a>
        <a href="index.html#products">تسوقي الآن</a>
        <a href="wishlist.html">المفضلة</a>
        <a href="account.html">حسابي</a>
      </nav>
    </div>
  </header>

  <main class="cart-page">

    <div class="cart-heading">
      <h1>سلة المشتريات</h1>
      <p>راجعي منتجاتك قبل إتمام الطلب</p>
    </div>

    <div id="cart-content"></div>

  </main>

  <footer class="main-footer">
    <p>© 2026 MISK ABAYAS - جميع الحقوق محفوظة</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>

  <script>
    const cartContent = document.getElementById('cart-content');

    function safeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function money(value) {
      return Number(value || 0).toLocaleString('ar-SA') + ' ر.س';
    }

    function getShippingSettings() {
      const config = window.STORE_CONFIG || {};

      return {
        fee: Number(config.shipping?.fee ?? config.shippingFee ?? 25),
        freeAbove: Number(config.shipping?.freeAbove ?? config.freeShippingMinimum ?? 500)
      };
    }

    function renderCart() {
      const store = window.MiskStore;

      if (!store) {
        cartContent.textContent = 'تعذر تحميل السلة. تأكدي من وجود ملف app.js.';
        return;
      }

      const items = store.getCart() || [];

      if (!items.length) {
        cartContent.innerHTML = `
          <div class="empty-cart">
            <div class="empty-icon">🛍️</div>
            <h2>سلتك فارغة حالياً</h2>
            <p>لم تضيفي أي منتجات إلى سلة المشتريات بعد.</p>
            <a href="index.html" class="checkout-button"
               style="max-width:250px;margin:20px auto;">
              اكتشفي منتجاتنا
            </a>
          </div>
        `;
        return;
      }

      const subtotal = items.reduce((sum, item) => {
        return sum + (Number(item.price || 0) * Number(item.quantity || 1));
      }, 0);

      const shippingSettings = getShippingSettings();
      const shipping = subtotal >= shippingSettings.freeAbove
        ? 0
        : shippingSettings.fee;

      const total = subtotal + shipping;

      const productsHTML = items.map((item, index) => {
        const name = safeText(item.name || item.title || 'منتج');
        const size = safeText(item.size || 'غير محدد');
        const quantity = Number(item.quantity || 1);
        const price = Number(item.price || 0);
        const lineTotal = price * quantity;

        const productId = safeText(item.productId ?? item.id ?? '');
        const image = item.image || item.image_url || '';

        return `
          <article class="cart-item">
            <img
              src="${safeText(image)}"
              alt="${name}"
              onerror="this.style.display='none'"
            >

            <div>
              <h3 class="item-name">${name}</h3>

              <p class="item-info">المقاس: ${size}</p>

              <p class="item-price">${money(price)}</p>

              <div class="quantity-control">
                <button type="button"
                  onclick="changeQuantity(${index}, -1)"
                  aria-label="تقليل الكمية">−</button>

                <span>${quantity}</span>

                <button type="button"
                  onclick="changeQuantity(${index}, 1)"
                  aria-label="زيادة الكمية">+</button>
              </div>

              <p class="item-info">الإجمالي: ${money(lineTotal)}</p>

              <button type="button"
                class="remove-item"
                onclick="removeItem(${index})">
                حذف المنتج
              </button>
            </div>
          </article>
        `;
      }).join('');

      cartContent.innerHTML = `
        <div class="cart-layout">

          <section class="cart-items">
            <h2 class="summary-title">منتجاتك (${items.length})</h2>
            ${productsHTML}
          </section>

          <aside class="cart-summary">
            <h2 class="summary-title">ملخص الطلب</h2>

            <div class="summary-row">
              <span>المجموع الفرعي</span>
              <strong>${money(subtotal)}</strong>
            </div>

            <div class="summary-row">
              <span>الشحن</span>
              <strong>${shipping === 0 ? 'مجاني' : money(shipping)}</strong>
            </div>

            <div class="summary-row summary-total">
              <span>الإجمالي</span>
              <strong>${money(total)}</strong>
            </div>

            <div class="shipping-note">
              ${
                shipping === 0
                  ? 'مبروك! حصلتِ على شحن مجاني.'
                  : `أضيفي منتجات بقيمة ${money(Math.max(0, shippingSettings.freeAbove - subtotal))} للحصول على شحن مجاني.`
              }
            </div>

            <a href="checkout.html" class="checkout-button">
              إتمام الطلب
            </a>

            <a href="index.html" class="continue-button">
              متابعة التسوق
            </a>
          </aside>

        </div>
      `;
    }

    function changeQuantity(index, amount) {
      const store = window.MiskStore;
      const items = store.getCart() || [];
      const item = items[index];

      if (!item) return;

      const newQuantity = Number(item.quantity || 1) + amount;

      if (newQuantity < 1) return;

      const productId = item.productId ?? item.id;

      store.updateCartItem(productId, item.size || '', newQuantity);
      renderCart();
    }

    function removeItem(index) {
      const store = window.MiskStore;
      const items = store.getCart() || [];
      const item = items[index];

      if (!item) return;

      const productId = item.productId ?? item.id;

      store.removeFromCart(productId, item.size || '');
      renderCart();
    }

    renderCart();
  </script>

</body>
</html>
