
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d32">
  <title>تفاصيل المنتج | MISK ABAYAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
    }

    .quality-box {
      display: none;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      padding: 15px;
      background: #f4f1e9;
      border: 1px solid #e5ddca;
      border-radius: 12px;
    }

    .quality-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #596044;
      color: white;
      border-radius: 50%;
      font-size: 20px;
    }

    .quality-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .quality-value {
      color: #123d32;
      font-size: 16px;
      font-weight: 800;
    }

    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-main-image {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      border-radius: 12px;
    }

    .product-thumbnails {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .product-thumbnail {
      width: 70px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .product-thumbnail.active {
      border-color: #596044;
    }
  </style>
</head>

<body>

  <div class="top-bar">MISK ABAYAS | أناقتك تبدأ من هنا</div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">MISK <span>ABAYAS</span></a>

      <nav class="main-nav">
        <a href="index.html">الرئيسية</a>
        <a href="index.html#products">المنتجات</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
      </nav>

      <div class="header-actions">
        <a href="wishlist.html" class="icon-link">♡</a>
        <a href="cart.html" class="icon-link">
          🛍 <span class="count-badge" data-cart-count>0</span>
        </a>
        <a href="account.html" class="icon-link">♙</a>
      </div>
    </div>
  </header>

  <div class="page-title">
    <div class="container">
      <h1>تفاصيل المنتج</h1>
      <div class="breadcrumb">
        <a href="index.html">الرئيسية</a> / تفاصيل المنتج
      </div>
    </div>
  </div>

  <main class="section">
    <div class="container">

      <div id="loading" class="empty-state">
        <h3>جاري تحميل المنتج...</h3>
      </div>

      <div id="productContent" class="card hidden">
        <div class="product-details-grid">

          <div class="product-gallery">
            <img
              id="productImage"
              class="product-main-image"
              src=""
              alt="صورة المنتج"
            >

            <div id="productThumbnails" class="product-thumbnails"></div>
          </div>

          <div>
            <p style="color:#c9a45c;font-size:13px;">MISK ABAYAS</p>

            <h2 id="productName" style="color:#123d32;margin:12px 0;"></h2>

            <div id="productPrice" class="product-price" style="font-size:22px;"></div>

            <p id="productDescription" style="color:#777;margin:20px 0;"></p>

            <!-- جودة المنتج -->
            <div id="qualityBox" class="quality-box">
              <div class="quality-icon">✦</div>
              <div>
                <div class="quality-label">جودة المنتج</div>
                <div id="productQuality" class="quality-value"></div>
              </div>
            </div>

            <!-- الألوان -->
            <div id="colorsSection" class="form-group hidden">
              <label>الألوان المتوفرة</label>
              <div id="productColors" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;"></div>
            </div>

            <div class="form-group">
              <label for="productSize">اختاري المقاس</label>
              <select id="productSize" class="form-control">
                <option value="">اختاري المقاس</option>
              </select>
            </div>

            <div class="form-group">
              <label for="productQuantity">الكمية</label>
              <select id="productQuantity" class="form-control"></select>
            </div>

            <div class="product-actions">
              <button id="addToCart" class="btn btn-dark" type="button">
                أضيفي إلى السلة
              </button>

              <button id="favorite" class="favorite-btn" type="button">
                ♡
              </button>
            </div>

            <div class="notice mt-20">
              شكرًا لاختيارك متجر MISK ABAYAS.
            </div>

          </div>
        </div>
      </div>

      <div id="notFound" class="empty-state hidden">
        <h3>المنتج غير موجود</h3>
        <a href="index.html" class="btn btn-dark mt-20">العودة للمتجر</a>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        جميع الحقوق محفوظة © MISK ABAYAS
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>

  <script type="module">
    import { getProduct } from "./js/products.js";

    const params = new URLSearchParams(location.search);
    const productId = params.get("id");

    const loading = document.getElementById("loading");
    const content = document.getElementById("productContent");
    const notFound = document.getElementById("notFound");

    let product = null;
    let selectedColor = null;

    function showPrice(item) {
      const price = Number(item.price || 0);
      const sale = item.salePrice;

      if (
        sale !== null &&
        sale !== undefined &&
        Number(sale) > 0 &&
        Number(sale) < price
      ) {
        return `
          ${Number(sale).toLocaleString("ar-SA")} ر.س
          <span class="old-price">${price.toLocaleString("ar-SA")} ر.س</span>
        `;
      }

      return `${price.toLocaleString("ar-SA")} ر.س`;
    }

    function showQuality(value) {
      const quality = String(value || "").trim();

      if (!quality) return;

      document.getElementById("productQuality").textContent = quality;
      document.getElementById("qualityBox").style.display = "flex";
    }

    function showColors(colors) {
      const section = document.getElementById("colorsSection");
      const container = document.getElementById("productColors");

      if (!Array.isArray(colors) || !colors.length) return;

      const validColors = colors.filter(color =>
        color && typeof color === "object" && color.value
      );

      if (!validColors.length) return;

      section.classList.remove("hidden");

      validColors.forEach((color, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.title = color.name || "لون المنتج";

        button.style.cssText = `
          width:34px;
          height:34px;
          border-radius:50%;
          background:${color.value};
          border:3px solid white;
          outline:1px solid #bbb;
          cursor:pointer;
        `;

        button.addEventListener("click", () => {
          selectedColor = color;

          container.querySelectorAll("button").forEach(item => {
            item.style.outline = "1px solid #bbb";
          });

          button.style.outline = "3px solid #596044";
        });

        if (index === 0) {
          selectedColor = color;
          button.style.outline = "3px solid #596044";
        }

        container.appendChild(button);

        const label = document.createElement("span");
        label.textContent = color.name || "";
        label.style.cssText = "align-self:center;color:#555;font-size:13px;";
        container.appendChild(label);
      });
    }

    function showImages(item) {
      const mainImage = document.getElementById("productImage");
      const thumbnails = document.getElementById("productThumbnails");

      const images = Array.isArray(item.images)
        ? item.images
        : [];

      const validImages = images
        .map(image => {
          if (typeof image === "string") return image;
          if (image && typeof image === "object") {
            return image.url || image.src || "";
          }
          return "";
        })
        .filter(Boolean);

      const allImages = validImages.length
        ? validImages
        : (item.image ? [item.image] : []);

      if (!allImages.length) {
        mainImage.alt = "لا توجد صورة لهذا المنتج";
        return;
      }

      mainImage.src = allImages[0];

      allImages.forEach((url, index) => {
        const thumbnail = document.createElement("img");

        thumbnail.src = url;
        thumbnail.alt = "صورة المنتج";
        thumbnail.className = "product-thumbnail";

        if (index === 0) thumbnail.classList.add("active");

        thumbnail.addEventListener("click", () => {
          mainImage.src = url;

          thumbnails.querySelectorAll("img").forEach(image => {
            image.classList.remove("active");
          });

          thumbnail.classList.add("active");
        });

        thumbnails.appendChild(thumbnail);
      });
    }

    async function loadProduct() {
      try {
        if (!productId) {
          throw new Error("No product ID");
        }

        product = await getProduct(productId);

        if (!product || !product.active) {
          throw new Error("Product not found");
        }

        document.getElementById("productName").textContent = product.name;
        document.getElementById("productPrice").innerHTML = showPrice(product);

        document.getElementById("productDescription").textContent =
          product.description || "لا يوجد وصف متاح لهذا المنتج.";

        // عرض الجودة المحفوظة في قاعدة البيانات
        showQuality(product.quality);

        // عرض الألوان
        showColors(product.colors);

        // عرض الصور
        showImages(product);

        const sizeSelect = document.getElementById("productSize");
        const sizes = Array.isArray(product.sizes) ? product.sizes : [];

        sizes.forEach(size => {
          const option = document.createElement("option");
          option.value = size;
          option.textContent = size;
          sizeSelect.appendChild(option);
        });

        if (!sizes.length) {
          sizeSelect.innerHTML =
            '<option value="">لا توجد مقاسات محددة</option>';
        }

        const quantitySelect = document.getElementById("productQuantity");

        const available = product.unlimited
          ? 10
          : Math.max(0, Number(product.quantity || 0));

        if (available === 0) {
          quantitySelect.innerHTML =
            '<option value="0">نفد المخزون</option>';

          document.getElementById("addToCart").disabled = true;
        } else {
          for (let i = 1; i <= Math.min(available, 10); i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            quantitySelect.appendChild(option);
          }
        }

        const favorite = document.getElementById("favorite");

        if (window.MiskStore.isFavorite(product.id)) {
          favorite.textContent = "♥";
        }

        favorite.addEventListener("click", () => {
          const added = window.MiskStore.toggleWishlist(product.id);
          favorite.textContent = added ? "♥" : "♡";
        });

        document.getElementById("addToCart").addEventListener("click", () => {
          const size = sizeSelect.value;
          const quantity = Number(quantitySelect.value);

          if (sizes.length && !size) {
            alert("يرجى اختيار المقاس.");
            return;
          }

          if (quantity < 1) {
            alert("المنتج غير متوفر حاليًا.");
            return;
          }

          const store = window.MiskStore;

          store.saveProducts([
            ...store.getProducts().filter(item =>
              String(item.id) !== String(product.id)
            ),
            product
          ]);

          const added = store.addToCart(product.id, quantity, size);

          if (added) {
            location.href = "cart.html";
          }
        });

        loading.classList.add("hidden");
        content.classList.remove("hidden");

      } catch (error) {
        console.error("خطأ تحميل المنتج:", error);
        loading.classList.add("hidden");
        notFound.classList.remove("hidden");
      }
    }

    loadProduct();
  </script>

</body>
</html>
